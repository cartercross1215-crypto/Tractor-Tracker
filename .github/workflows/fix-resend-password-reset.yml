name: Fix Resend password reset

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-resend-password-reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch Resend password reset support
        run: |
          python3 <<'PY'
          from pathlib import Path

          server_path = Path('server.py')
          render_path = Path('render.yaml')
          server = server_path.read_text()

          old_status_block = '''def resend_status_payload():
    resend_api_key = os.environ.get("RESEND_API_KEY", "").strip()
    resend_from = os.environ.get("RESEND_FROM", "").strip()
    return {
        "configured": bool(resend_api_key and resend_from),
        "apiKeySet": bool(resend_api_key),
        "fromSet": bool(resend_from),
        "from": resend_from or None,
        "publicUrlSet": bool(os.environ.get("TRACTOR_TRACKER_PUBLIC_URL", "").strip()),
    }
'''

          new_status_block = '''def resend_from_address():
    configured_from = os.environ.get("RESEND_FROM", "").strip()
    smtp_from = os.environ.get("SMTP_FROM", "").strip()
    return configured_from or smtp_from or f"Tractor Tracker <{SUPPORT_EMAIL}>"


def resend_status_payload():
    resend_api_key = os.environ.get("RESEND_API_KEY", "").strip()
    resend_from = resend_from_address()
    return {
        "configured": bool(resend_api_key and resend_from),
        "apiKeySet": bool(resend_api_key),
        "fromSet": bool(resend_from),
        "from": resend_from or None,
        "publicUrlSet": bool(os.environ.get("TRACTOR_TRACKER_PUBLIC_URL", "").strip()),
    }
'''

          if 'def resend_from_address():' not in server:
              if old_status_block not in server:
                  raise SystemExit('Could not find resend_status_payload block to replace')
              server = server.replace(old_status_block, new_status_block)

          old_send_lines = '''        resend_api_key = os.environ.get("RESEND_API_KEY", "").strip()
        resend_from = os.environ.get("RESEND_FROM", "").strip()

        if not resend_api_key or not resend_from:
            return False
'''
          new_send_lines = '''        resend_api_key = os.environ.get("RESEND_API_KEY", "").strip()
        resend_from = resend_from_address()

        if not resend_api_key or not resend_from:
            return False
'''
          if old_send_lines in server:
              server = server.replace(old_send_lines, new_send_lines)

          # Add an HTML reset-link body too, so email clients make the reset link easier to tap.
          old_payload = '''        payload = json.dumps({
            "from": resend_from,
            "to": [to_address],
            "subject": subject,
            "text": text_body,
        }).encode("utf-8")
'''
          new_payload = '''        html_body = "<br>".join(line if line.startswith("http") else line for line in text_body.splitlines())
        payload = json.dumps({
            "from": resend_from,
            "to": [to_address],
            "subject": subject,
            "text": text_body,
            "html": html_body,
            "reply_to": SUPPORT_EMAIL,
        }).encode("utf-8")
'''
          if old_payload in server:
              server = server.replace(old_payload, new_payload)

          server_path.write_text(server)

          render = render_path.read_text()
          render = render.replace('''      - key: RESEND_FROM\n        sync: false\n''', '''      - key: RESEND_FROM\n        value: "Tractor Tracker <support@tractortracker.farm>"\n''')
          render_path.write_text(render)
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No Resend password reset changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.py render.yaml
          git commit -m "Fix Resend password reset email"
          git push
